[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-drift-explainability"
version = "0.1.0"
description = "Temporal Faithfulness of Explanations Under Concept Drift in Streaming Fraud Detection"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Manpreet Singh", email = "manni@bu.edu" },
    { name = "Muhammad Zeeshan", email = "m.zeeshan.itcs@gmail.com" },
    { name = "Yash Jajoo", email = "yj1499@nyu.edu" },
    { name = "Deboleena Ganguly", email = "deboleenag@smu.edu" },
    { name = "Anant Singh", email = "asingh@dvtrading.co" },
    { name = "Rahul Joshi", email = "rahulj@sitpune.edu.in" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shap>=0.44",
    "lime>=0.2.0.1",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
